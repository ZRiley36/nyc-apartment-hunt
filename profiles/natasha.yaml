name: natasha
email: zachriley36@gmail.com      # alerts go to Zach for now; he forwards the report link to Natasha
enabled: true
budget:
  per_room_max: 2700              # her share cap: total rent / bedrooms (one person per bedroom)
locations: ["Midtown, Manhattan, NY", "Lower Manhattan, New York, NY"]  # "all midtown/downtown"
bedrooms: { min: 2 }              # 2+ bed (needed to split rent)
bathrooms: { min: 1 }
min_bath_per_bed: 0.5             # >=1 bath per 2 beds — excludes e.g. 3 bed / 1 bath
move_in: { earliest: 2026-09-01, latest: 2026-10-15 }  # targets 9/1, buffer to mid-Oct
amenities:
  laundry_in_building: preferred  # her must-haves as preferred (data is sparse; required caps at Consider)
  elevator: preferred
run:
  sources: [aggregator]
  radius_miles: 2.0               # wide — she wants all of midtown/downtown, not one block
  max_verify_per_run: 25
